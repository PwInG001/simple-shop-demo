<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试图片</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .test-section {
            margin: 20px 0;
            padding: 20px;
            border: 2px solid #ddd;
            border-radius: 10px;
        }
        img {
            max-width: 300px;
            border: 2px solid #667eea;
            border-radius: 10px;
        }
        .success {
            background: #d4edda;
            border-color: #28a745;
        }
        .error {
            background: #f8d7da;
            border-color: #dc3545;
        }
    </style>
</head>
<body>
    <h1>🔍 图片加载测试</h1>

    <div class="test-section">
        <h2>测试 1：相对路径</h2>
        <p>路径：<code>images/wechat-qr.jpg</code></p>
        <img src="images/wechat-qr.jpg" alt="微信收款码"
             onerror="this.parentElement.className='test-section error'; this.nextElementSibling.style.display='block';"
             onload="this.parentElement.className='test-section success';">
        <p style="display: none; color: #721c24; font-weight: bold;">❌ 加载失败</p>
    </div>

    <div class="test-section">
        <h2>测试 2：绝对路径（从根目录）</h2>
        <p>路径：<code>/images/wechat-qr.jpg</code></p>
        <img src="/images/wechat-qr.jpg" alt="微信收款码"
             onerror="this.parentElement.className='test-section error'; this.nextElementSibling.style.display='block';"
             onload="this.parentElement.className='test-section success';">
        <p style="display: none; color: #721c24; font-weight: bold;">❌ 加载失败</p>
    </div>

    <div class="test-section">
        <h2>调试信息</h2>
        <p>当前 URL：<code id="currentUrl"></code></p>
        <p>图片完整 URL（相对路径）：<code id="imageUrl1"></code></p>
        <p>图片完整 URL（绝对路径）：<code id="imageUrl2"></code></p>
    </div>

    <div class="test-section">
        <h2>操作</h2>
        <button onclick="checkAllImages()">重新测试所有图片</button>
        <button onclick="showConsoleInfo()">显示控制台信息</button>
    </div>

    <script>
        // 显示当前 URL
        document.getElementById('currentUrl').textContent = window.location.href;

        // 计算图片的完整 URL
        const relativeUrl = new URL('images/wechat-qr.jpg', window.location.href).href;
        const absoluteUrl = new URL('/images/wechat-qr.jpg', window.location.href).href;

        document.getElementById('imageUrl1').textContent = relativeUrl;
        document.getElementById('imageUrl2').textContent = absoluteUrl;

        function checkAllImages() {
            location.reload();
        }

        function showConsoleInfo() {
            console.log('当前 URL:', window.location.href);
            console.log('相对路径 URL:', relativeUrl);
            console.log('绝对路径 URL:', absoluteUrl);
            alert('调试信息已输出到控制台（F12 → Console 查看）');
        }

        // 页面加载后自动检查
        window.onload = function() {
            setTimeout(() => {
                const images = document.querySelectorAll('img');
                let failed = 0;
                images.forEach(img => {
                    if (!img.complete || img.naturalWidth === 0) {
                        failed++;
                    }
                });
                if (failed > 0) {
                    console.error(`有 ${failed} 张图片加载失败`);
                }
            }, 1000);
        };
    </script>
</body>
</html>
